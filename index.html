<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo!</title>

    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/index.css">


</head>
<body>
    <main class="container">

        <img src="./img/logo.png" alt="Logo do site" width="100px" height="100px">
            
        <form action="#" method="post">
    
            <fieldset>
                <legend>Bem Vindo!</legend>

                <div class="form-field">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="Digite seu email">
                </div>
                
                <div class="form-field">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" name="password" id="password">
                </div>

                <div class="row">
                    <div class="btn-group botoes col-6">
                        <button type="submit" class="btn-solid theme-primary ">Enviar</button>
                        <a href="#" class="btn-solid theme-info">Esqueci a senha</a>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
